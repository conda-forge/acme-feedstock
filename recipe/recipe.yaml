schema_version: 1

context:
  version: "5.10.0"

package:
  name: acme
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/acme/acme-${{ version }}.tar.gz
  sha256: 12f7de98431d39028e02daafe512a82a1496964cbebcfe6d9a115147c9ad1861

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - cryptography >=47.0.0
    - josepy >=2.0.0
    - pyopenssl >=25.0.0
    - pyrfc3339
    - requests >=2.25.1
tests:
  - python:
      imports:
        - acme
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: ACME protocol implementation in Python
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - nehaljwani
    - pavelzw
